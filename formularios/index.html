<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
    <h1>Formularios</h1>
    <h2>Formulario 1</h2>
    <form>
        <fieldset>
            <legend>Completar</legend>
                <label for="color">Elija un color:</label>
                <input type="color" id="color"/><br/>
                <textarea name="textarea" id="textarea" rows="5" cols="53" placeholder="Por favor, escriba aquí"></textarea><br/>
                <select name="lenjuage" id="lenjuage">
                    <option value="Java">Java</option>
                    <option value="Python">Python</option>
                    <option value="HTML">HTML</option>
                </select><br/>
                <input type="checkbox" name="ciclo" value="cicloasir"/>
                <label for="cicloasir">ASIR</label>
                <input type="checkbox" name="ciclo" value="ciclodam"/>
                <label for="cicloasir">DAM</label>
                <input type="checkbox" name="ciclo" value="ciclodaw"/>
                <label for="cicloasir">DAW</label>
        </fieldset>
    </form>
    <form>
        <fieldset>
            <legend>Rellene las opciones siguientes</legend>
                <label for="date">Elija una fecha:</label>
                <input type="date" id="date"><br/>
                <label for="fichero">Elija un fichero:</label>
                <input type="file" id="fichero"><br/>
                <select name="ciclos" id="ciclos" multiple>
                    <option value="SMIR">SMIR</option>
                    <option value="ASIR">ASIR</option>
                    <option value="DAM">DAM</option>
                    <option value="DAW">DAW</option>
                </select>
        </fieldset>
    </form>
    <h2>Formulario 2</h2>
    <form>
        <fieldset>
            <legend>Rellenar</legend>
                </select><br/>
                <input type="radio" name="asignatura" value="asignaturalengua"/>
                <label for="asignaturalengua">Lengua</label><br/>
                <input type="radio" name="asignatura" value="asignaturamatematicas"/>
                <label for="asignaturamatematicas">Matemáticas</label><br/>
                <input type="radio" name="asignatura" value="asignaturahistoria"/>
                <label for="asignaturahistoria">Historia</label><br/>
                <input type="radio" name="asignatura" value="asignaturageografia"/>
                <label for="asiganturageografia">Geografía</label><br/><br/>

                <input type="checkbox" name="editor" value="editornotepad"/>
                <label for="editornotepad">Notepad</label>
                <input type="checkbox" name="editor" value="editoremacs"/>
                <label for="editoremacs">Emacs</label>
                <input type="checkbox" name="editor" value="editorotro"/>
                <label for="editorotro">Otro</label><br/>
                <textarea name="textarea" id="textarea" rows="5" cols="59" placeholder="Escriba aquí, por favor"></textarea><br/>
                <select name="procesador" id="procesador">
                    <option value="amd">AMD</option>
                    <option value="intel_i5">ASIR</option>
                    <option value="intel_i7">Intel i7</option>
                </select>
        </fieldset>
    </form>
    <h2>Formulario 3</h2>
    <form>
        <fieldset>
            <legend>Rellenar</legend>
                </select><br/>
                <input type="radio" name="asignatura" value="asignaturalengua"/>
                <label for="asignaturalengua">Lengua</label>
                <input type="radio" name="asignatura" value="asignaturamatematicas"/>
                <label for="asignaturamatematicas">Matemáticas</label>
                <input type="radio" name="asignatura" value="asignaturahistoria"/>
                <label for="asignaturahistoria">Historia</label>
                <input type="radio" name="asignatura" value="asignaturageografia"/>
                <label for="asiganturageografia">Geografía</label><br/>
                <label for="time">Elija una hora</label>
                <input type="time" id="time"><br/>
                <input type="checkbox" name="idioma" value="idiomaespañol"/>
                <label for="idiomaespañol">Español</label><br/>
                <input type="checkbox" name="idioma" value="idiomaingles"/>
                <label for="idiomafrances">Inglés</label><br/>
                <input type="checkbox" name="idioma" value="idiomaaleman"/>
                <label for="idiomaaleman">Alemén</label><br/>
                <input type="checkbox" name="idioma" value="idiomafrances"/>
                <label for="idiomafrances">Francés</label><br/>
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre">
                <label for="apellidos">Apellidos</label>
                <input type="text" id="apellidos" name="apellidos">
        </fieldset>
    </form>
</body>
</html>
