<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extraordinaria</title>
    <style>
        p {
            font-size: 16px;
        }
        div {
            border: 2px solid blue;
        }
        h1 {
            color: blue;
        }
        h2 {
            color: green;
        }
        body {
            background-image: url("img/textura-papel-blanco_1194-2301.avif");
        }
    </style>
</head>
<body>

    <h1>Este es mi examen</h1>

    <p><a href="https://www.vedoque.com">Esta es una buena página</a></p>

    <figure>
        <img src="img/cascada-naturaleza-tailandia_335224-989.avif" alt="paisaje" height="100">
        <figcaption>Esta es una gran imagen</figcaption>
    </figure>

    <h2 style="background-color: white;">El examen está siendo fácil</h2>
    <p>No esperaba que fuera tan fácil</p>

    <table border="1">
        <tr>
            <th>Nombre</th>
            <th>Nota</th>
        </tr>
        <tr>
            <td>Dani</td>
            <td>9</td>
        </tr>
        <tr>
            <td>Marco</td>
            <td>10</td>
        </tr>
        <tr>
            <td>Paco</td>
            <td>9</td>
        </tr>
    </table>
    <br>

    <form>
        <div>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required>
        </div>
        <br>

        <div>
            <label for="ciclo">Elige un ciclo:</label>
            <select id="ciclo" name="ciclo">
                <option value="asir">ASIR</option>
                <option value="dam">DAM</option>
                <option value="daw">DAW</option>
            </select>
        </div>
        <br>

        <div>
            <span>Curso:</span><br>
            <input type="radio" id="primero" name="curso" value="1" checked>
            <label for="primero">Primero</label><br>

            <input type="radio" id="segundo" name="curso" value="2">
            <label for="segundo">Segundo</label>
        </div>
        <br>

        <div>
            <span>Estudios previos:</span><br>
            <input type="checkbox" id="bachillerato" name="estudios" value="bachillerato">
            <label for="bachillerato">Bachillerato</label><br>

            <input type="checkbox" id="smr" name="estudios" value="smr">
            <label for="smr">SMR</label>
        </div>
        <br>

        <button type="submit">Enviar</button>
    </form>

    <footer>Hoy sí que voy a aprobar.</footer>
</body>
</html>
