<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centrado de Imágenes</title>

    <style>
        img{
            display: block;
            margin: 50px auto;
        }
        .perry{
            position: fixed;
            top: auto;
            left: 80%;
            width: 20%;
        }
        .phineas{
            position: fixed;
            top: 70%;
            left: 0%;
            width: 20%;
        }
        .willy{
            position: fixed;
            top: 30%;
            left: 35%;
            width: 20%;
        }

    </style>

    
</head>
<body>
    <h1>Centrado de Imágenes</h1>

    <div>
        <div>
            <img class="perry" src="img/perry.jpg" alt="Perry el ornitorrinco">
        </div>
    </div>
    <img class="willy" src="img/willy.webp" alt="Perro Bonito">
    <img class="phineas" src="img/phineas.jpg" alt="Phineas">

</body>
</html>
