<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centrado de Imágenes</title>

    <style>
        img{
            display: block;
            margin: 50px auto;
            border-radius: 200px;
        }
        .perry{
            position: fixed;
            top: auto;
            left: 60%;
            width: 30%;
        }
        .phineas{
            position: absolute;
            top: 70%;
            left: 0%;
            width: 20%;
        }

    </style>

    
</head>
<body>
    <h1>Centrado de Imágenes</h1>

    <img class="perry" src="img/perry.jpg" alt="Perry el ornitorrinco">
    <img class="phineas" src="img/phineas.jpg" alt="Phineas">

</body>
</html>
