<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primero</title>
    <style>
        
        p{
            font-size: 2em;
            font-weight: bold;
        }
        .parrafo_amarillo{
            color: yellow;
        }
        .parrafo_verde{
            color: rgb(39, 122, 39);
            font-family: Arial, Helvetica, sans-serif;
        }
        .parrafo_azul{
            color: blue;
            font-family: 'Courier New', Georgia;
        }
    </style>
</head>
<body>
    <h1 class="parrafo_azul">Empezando con CSS</h1>
    <p class="parrafo_amarillo">Esto es un parrafo de color Amarillo</p>
    <p class="parrafo_verde">Esto es un parrafo de color Verde</p>
    <p class="parrafo_azul">Esto es un parrafo de color Azul</p>

    <div style="border: 2px dotted red; margin: 20px; padding: 50px;">Primer Bloque</div>
    <div style="border: 5px dashed green; padding-top: 100px; margin-top: 100px;"> segundo bloque</div>

</body>
</html>
