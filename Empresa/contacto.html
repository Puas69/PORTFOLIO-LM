    <header>
        <nav>
            <ul>

    <main>

        <h1>Frucimu</h1>

        <article>

            <form>
                <fieldset>
                    <legend>Formulario de Contacto</legend>
                    <label for="nombre">Nombre:</label><br>
                    <input type="text" class="nombre" placeholder="Nombre"><br>
                    <label for="Apellido">Apellido:</label><br>
                    <input type="text" class="Apellido" placeholder="Apellido"><br>
                    <label for="email">Email:</label><br>
                    <input type="email" class="email"><br>
                    <label for="texto">Que necesitas?</label><br>
                    <textarea name="texto" class="texto"></textarea><br>
                    <label for="tema">Motivo de su contacto:</label><br>
                    <select name="tema">
                        <option value="Compra">Compra</option>
                        <option value="Venta">Venta</option>
                        <option value="Otro">Otro</option>
                    </select><br><br>
                    <button type="submit">Enviar</button>
                    <button type="reset">Borrar</button>
                </fieldset>
            </form>

        </article>

    </main>
